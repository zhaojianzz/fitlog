<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="练吃睡">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>练吃睡记录</title>
<style>
:root{
  --bg:#f2f4f7;--card:#fff;--fg:#14181c;--mut:#6f7a85;--faint:#a7b0b9;--line:#e6e9ee;--soft:#f6f7f9;
  --acc:#1677ff;--acc-soft:#e8f1ff;--ok:#16a34a;--ok-soft:#e7f6ec;--warn:#d97706;--warn-soft:#fdf3e2;--bad:#dc2626;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);--r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1114;--card:#181c21;--fg:#eef1f4;--mut:#94a0ac;--faint:#5c6773;--line:#262c33;--soft:#20252b;
  --acc:#4c9bff;--acc-soft:#16273d;--ok:#3ccf7a;--ok-soft:#14301f;--warn:#f0a63a;--warn-soft:#352812;--bad:#f87171;
  --shadow:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;
  padding:0 0 calc(76px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.97)}
input,select{font:inherit;color:var(--fg)}
.num{font-variant-numeric:tabular-nums}

/* 顶部日期 */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
.datebar{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;min-height:48px}
.datebar .arrow{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.datebar .arrow:active{background:var(--line)}
.datebar .mid{position:relative;text-align:center}
.datebar .mid b{display:block;font-size:20px;letter-spacing:.5px}
.datebar .mid span{font-size:13px;color:var(--mut)}
.datebar .mid input{position:absolute;inset:0;opacity:0;width:100%}
.today-link{font-size:13px;color:var(--acc);margin-left:6px;position:relative;z-index:2}
.pagetitle{width:100%;font-size:28px;font-weight:700}

main{padding:4px 16px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.sec{font-size:13px;color:var(--mut);font-weight:600;margin:18px 4px 8px;letter-spacing:.5px}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* 底部导航 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);padding:4px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}

/* 训练 */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stats{display:flex;gap:8px;margin-top:14px}
.stats div{flex:1;background:var(--soft);border-radius:12px;padding:10px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--mut)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.ex{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.ex-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.ex-h:active{transform:none;background:var(--soft)}
.dot{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--soft);color:var(--mut)}
.dot.part{background:var(--acc-soft);color:var(--acc)}
.dot.done{background:var(--ok);color:#fff}
.ex-h .t{font-weight:600}
.ex-h .s{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--faint);transition:transform .2s;display:grid}
.ex.open .chev{transform:rotate(90deg)}
.ex-b{padding:0 16px 16px}
.hint{font-size:13px;padding:8px 10px;border-radius:10px;margin-bottom:12px}
.hint.ok{background:var(--ok-soft);color:var(--ok)}.hint.warn{background:var(--warn-soft);color:var(--warn)}.hint.mut{background:var(--soft);color:var(--mut)}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.set{font-size:14px;padding:6px 10px;border-radius:10px;background:var(--soft)}
.set small{color:var(--mut);margin-right:4px}
.pick{display:flex;gap:10px;margin-bottom:12px}
.pick>div{flex:1;background:var(--soft);border-radius:14px;padding:8px 6px;text-align:center}
.pick label{font-size:12px;color:var(--mut)}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:22px;color:var(--acc);box-shadow:var(--shadow)}
.stepper input{width:64px;text-align:center;border:0;background:none;font-size:26px;font-weight:700;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.big{display:block;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:17px;text-align:center}
.ghost{padding:10px 14px;border-radius:12px;background:var(--acc-soft);color:var(--acc);font-weight:600;white-space:nowrap}
.field{background:var(--soft);border:0;border-radius:12px;padding:11px 12px;min-width:0;width:100%}

/* 休息计时 */
#rest{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;max-width:536px;margin:0 auto;
  background:var(--fg);color:var(--bg);border-radius:18px;padding:12px 14px;display:none;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#rest.show{display:flex}
#rest.done{background:var(--ok);color:#fff}
#rest .clock{font-size:24px;font-weight:700;min-width:62px}
#rest .lbl{flex:1;font-size:13px;opacity:.8}
#rest button{padding:6px 10px;border-radius:10px;background:rgba(127,127,127,.25);font-size:14px}
#rest .bar{position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:2px;overflow:hidden;background:rgba(127,127,127,.3)}
#rest .bar i{display:block;height:100%;background:currentColor}

/* 饮食 */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:26px;display:block;line-height:1}
.ring .c span{font-size:12px;color:var(--mut)}
.log{margin-top:14px;border-top:.5px solid var(--line)}
.log>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line)}
.log>div:last-child{border-bottom:0}
.log time{font-size:13px;color:var(--mut);width:40px}
.x{width:28px;height:28px;border-radius:50%;color:var(--faint);display:grid;place-items:center;font-size:18px;flex:none}
.x:active{background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.food{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.food b{font-size:15px;font-weight:600}
.food span{font-size:13px;color:var(--mut)}
.food.flash{animation:flash .6s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;background:var(--soft);font-size:14px}
.chip.on{background:var(--acc);color:#fff}
@keyframes flash{from{background:var(--acc-soft)}to{background:var(--card)}}

/* 身体 */
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.fl:last-child{border-bottom:0}
.fl>span{font-size:15px}
.fl input[type=time],.fl input[type=number]{border:0;background:var(--soft);border-radius:10px;padding:8px 10px;width:116px;text-align:right;font-weight:600}
.scale{display:flex;gap:6px}
.scale button{width:36px;height:36px;border-radius:10px;background:var(--soft);font-weight:600;color:var(--mut)}
.scale button.on{background:var(--acc);color:#fff}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--warn)}
.switch.on::after{left:23px}
.sleepbig{display:flex;align-items:baseline;gap:6px;padding-bottom:4px}
.sleepbig b{font-size:34px}

/* 趋势 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kpi span{font-size:13px;color:var(--mut)}
.kpi b{display:block;font-size:24px;margin:2px 0}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--warn)}.down{color:var(--ok)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
svg.chart text{fill:var(--faint);font-size:20px}
.chartsel{width:100%;border:0;background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:600;-webkit-appearance:none;appearance:none}

/* 提示条 */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);z-index:40;background:var(--fg);color:var(--bg);
  border-radius:14px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;transition:transform .25s;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap}
#toast:not(.show){visibility:hidden;transition:transform .25s,visibility 0s .25s}
#toast.show{transform:translate(-50%,0)}
#toast button{color:var(--acc);font-weight:700}
.empty{text-align:center;color:var(--faint);font-size:14px;padding:14px 0}
</style>
</head>
<body>
<header><div class="datebar" id="datebar"></div></header>
<main id="main"></main>
<div id="rest"></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
// ---------- 计划配置（改动作就改这里）----------
const PLAN = {
  A: [
    {n:'深蹲（或倒蹬／哈克）', lo:6, hi:10, main:true},
    {n:'杠铃平板卧推', lo:6, hi:10, main:true},
    {n:'坐姿绳索划船', lo:10, hi:12},
    {n:'辅助引体向上', lo:8, hi:12, main:true, assist:true},
    {n:'坐姿腿弯举', lo:10, hi:15},
    {n:'哑铃侧平举', lo:12, hi:20},
    {n:'直杆绳索下压（可选）', lo:10, hi:15},
  ],
  B: [
    {n:'罗马尼亚硬拉', lo:6, hi:10, main:true},
    {n:'上斜哑铃卧推', lo:8, hi:12, main:true},
    {n:'宽距下拉', lo:8, hi:12, main:true},
    {n:'面拉（绳索）', lo:12, hi:15},
    {n:'倒蹬／哈克深蹲', lo:8, hi:12},
    {n:'站姿提踵', lo:10, hi:15},
    {n:'辅助双杠臂屈伸（可选）', lo:8, hi:12, assist:true},
    {n:'牧师器弯举（可选）', lo:10, hi:15},
  ]
};
const PROTEIN_TARGET = 120;
const KCAL_TARGET = 2200; // 只作参考，热量缺口以体重趋势为准
const MEALS = ['早餐','米饭和素菜','午餐','加餐','晚餐','其他'];
// 一键按钮：p 蛋白质 g，k 热量 kcal（外食估算）
// 满碗 = 食堂锥形饭碗（口径约 13–14 cm、底约 7 cm、深约 6 cm）装平，约 280 g 熟米饭（按照片比例推算）
// 素菜一格 = 分格盘一格装满，约 140 g 炒素菜
const DEFAULT_PRESETS = [
  {n:'2 茶叶蛋＋菜包', p:16, k:280, c:'早餐'}, {n:'纯牛奶 250 mL', p:8, k:160, c:'早餐'}, {n:'茶叶蛋 1 个', p:6, k:72, c:'早餐'},
  {n:'米饭 满碗', p:7, k:325, c:'米饭和素菜'}, {n:'米饭 大半碗', p:5, k:245, c:'米饭和素菜'}, {n:'米饭 半碗', p:4, k:160, c:'米饭和素菜'},
  {n:'素菜一格', p:3, k:110, c:'米饭和素菜'},
  {n:'卤鸡腿 2 只（去皮）', p:24, k:160, c:'午餐'}, {n:'卤鸡腿 1 只（去皮）', p:12, k:80, c:'午餐'}, {n:'鸭腿 1 只（去皮）', p:23, k:180, c:'午餐'},
  {n:'豆干一份', p:10, k:80, c:'午餐'},
  {n:'即食鸡胸一包', p:18, k:120, c:'加餐'}, {n:'增肌粉 85 g', p:20, k:330, c:'加餐'}, {n:'乳清一勺', p:22, k:120, c:'加餐'},
  {n:'高蛋白酸奶', p:15, k:150, c:'加餐'}, {n:'香蕉', p:1, k:110, c:'加餐'},
  {n:'瘦肉主菜一份（约一掌心）', p:27, k:260, c:'晚餐'}, {n:'肉少的荤菜（肉丝、酸菜肉片）', p:9, k:230, c:'晚餐'},
];
// 旧版的整餐按钮，拆成上面的单项后从按钮里移除；旧记录保留原值
const LEGACY_PRESETS = {'双鸡腿午餐':{p:33,k:650}, '瘦肉晚餐（一掌心）':{p:30,k:650}, '肉少的晚餐':{p:15,k:650}};
// v3：鸡腿按钮改为去皮数值；用户一直是去皮吃的，旧记录一并改名改值
const RENAMED_V3 = {'卤鸡腿 2 只':'卤鸡腿 2 只（去皮）', '卤鸡腿 1 只':'卤鸡腿 1 只（去皮）'};
// 食物库：每 100 g 可食部分的蛋白质 p 和热量 k；u 为常用单位对应的克数（"两"=50 g 通用）
// 数值参考《中国食物成分表》常见值取整，外食做法不同会有出入
const FOODS = [
  {g:'肉蛋豆', n:'卤鸡腿（快餐小琵琶腿，去皮）', p:26, k:175, u:{'只':45}, h:'一只 ≈ 45 g 去皮的肉（约 9–10 cm 长的小琵琶腿）；带皮吃每只再加约 40 kcal'},
  {g:'肉蛋豆', n:'鸭腿（去皮）', p:22, k:170, u:{'只':105}, h:'一只 ≈ 105 g 去皮的肉（盖饭里常见的大鸭腿）；带皮吃每只再加约 200 kcal'},
  {g:'肉蛋豆', n:'鸡腿肉（熟，去骨）', p:24, k:200, u:{'掌心':100}},
  {g:'肉蛋豆', n:'鸡胸肉（熟）', p:30, k:165, u:{'掌心':100}},
  {g:'肉蛋豆', n:'瘦猪肉（熟）', p:27, k:200, u:{'掌心':100}},
  {g:'肉蛋豆', n:'肥瘦猪肉／五花（熟）', p:14, k:420, u:{'掌心':100}},
  {g:'肉蛋豆', n:'牛肉（熟，瘦）', p:30, k:200, u:{'掌心':100}},
  {g:'肉蛋豆', n:'鱼肉（熟）', p:20, k:120, u:{'掌心':100}},
  {g:'肉蛋豆', n:'虾仁（熟）', p:22, k:100, u:{'掌心':100}},
  {g:'肉蛋豆', n:'鸡蛋／卤蛋', p:13, k:144, u:{'个':50}},
  {g:'肉蛋豆', n:'北豆腐', p:12, k:98, u:{'块':150}},
  {g:'肉蛋豆', n:'豆干', p:16, k:145, u:{'片':15}},
  {g:'主食', n:'米饭（熟）', p:2.6, k:116, u:{'满碗':280}},
  {g:'主食', n:'面条（湿面，按店里的两数）', p:8.5, k:285},
  {g:'主食', n:'馒头', p:7, k:220, u:{'个':100}},
  {g:'主食', n:'肉包子', p:8, k:230, u:{'个':80}},
  {g:'主食', n:'菜包子', p:6, k:180, u:{'个':70}},
  {g:'主食', n:'小笼包', p:9, k:240, u:{'个':25}},
  {g:'主食', n:'抄手／饺子', p:8, k:200, u:{'个':20}},
  {g:'主食', n:'白粥', p:1.1, k:46, u:{'碗':300}},
  {g:'主食', n:'红薯／土豆', p:1.5, k:90, u:{'个':200}},
  {g:'奶饮', n:'纯牛奶', p:3.2, k:65, u:{'盒':250}},
  {g:'奶饮', n:'无糖豆浆', p:3, k:35, u:{'杯':300}},
  {g:'奶饮', n:'普通酸奶', p:3, k:90, u:{'盒':200}},
  {g:'奶饮', n:'乳清蛋白粉', p:75, k:390, u:{'勺':30}},
  {g:'奶饮', n:'增肌粉（康比特 MASS）', p:24, k:390, u:{'勺':85}},
  {g:'果蔬', n:'炒素菜（含油）', p:2, k:80, u:{'格':140}},
  {g:'果蔬', n:'香蕉', p:1.4, k:93, u:{'根':120}},
  {g:'果蔬', n:'苹果／橙子', p:0.5, k:50, u:{'个':200}},
  {g:'其他', n:'士力架', p:9, k:490, u:{'条':51}},
  {g:'其他', n:'花生／坚果', p:25, k:590, u:{'把':15}},
];
function foodCalc(f, qty, unit){ // 返回 {p, k, grams}
  const grams = qty * (unit==='g' ? 1 : unit==='两' ? 50 : (f.u && f.u[unit]) || 1);
  return {grams, p: Math.round(f.p*grams/100), k: Math.round(f.k*grams/100)};
}

// ---------- 存储（格式与旧版相同，旧数据直接可用）----------
const KEY = 'fitlog-v1';
let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
db = Object.assign({sets:[], food:[], body:{}, presets:DEFAULT_PRESETS, start:null}, db || {});
db.food.forEach(f => { if(f.k==null){ const d = LEGACY_PRESETS[f.n] || db.presets.find(x=>x.n===f.n); if(d && d.k!=null) f.k = d.k; } });
if((db.pv||1) < 2){ // 一次性：去掉旧整餐按钮，补上新的单项按钮
  db.presets = db.presets.filter(p=>!LEGACY_PRESETS[p.n]);
  DEFAULT_PRESETS.forEach(d=>{ if(!db.presets.some(p=>p.n===d.n)) db.presets.push({...d}); });
  db.pv = 2;
}
if(db.pv < 3){
  db.presets = db.presets.filter(p=>!RENAMED_V3[p.n]);
  DEFAULT_PRESETS.forEach(d=>{ if(!db.presets.some(p=>p.n===d.n)) db.presets.push({...d}); });
  db.food.forEach(f=>{ const n = RENAMED_V3[f.n]; if(n){ const d = DEFAULT_PRESETS.find(x=>x.n===n); f.n = n; f.p = d.p; f.k = d.k; } });
  db.pv = 3;
}
db.presets.forEach(p => { const d = DEFAULT_PRESETS.find(x=>x.n===p.n); if(!p.c || !MEALS.includes(p.c)) p.c = d ? d.c : '其他'; if(p.k==null && d) p.k = d.k; });
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ alert('保存失败：' + e.message); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ---------- 工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
const todayStr = () => ymd(new Date());
function addDays(s, n){ const d=new Date(s+'T00:00'); d.setDate(d.getDate()+n); return ymd(d); }
const fmt1 = v => (Math.round(v*10)/10).toString();
function sleepHours(bed, wake){ // "01:00","08:30" -> 7.5，跨午夜也对
  if(!bed||!wake) return null;
  const m = t => { const [h,mi]=t.split(':').map(Number); return h*60+mi; };
  return ((m(wake)-m(bed)+1440)%1440)/60;
}
function trainWeek(date){ // 以第一次训练日为第 1 周
  if(!db.start) return 1;
  return Math.floor((new Date(date+'T00:00') - new Date(db.start+'T00:00'))/864e5/7)+1;
}
function targetSets(ex, date){ return ex.main && trainWeek(date) >= 3 ? 3 : 2; }
function lastSession(name, before){
  const prev = db.sets.filter(s => s.ex===name && s.date < before);
  if(!prev.length) return null;
  const d = prev.reduce((a,s)=> s.date>a ? s.date : a, '');
  return {date:d, sets: prev.filter(s=>s.date===d)};
}
function hint(ex, last, date){
  if(!last) return {cls:'mut', t:'第一次记录：选一个有把握的重量，做到 '+ex.lo+' 次时还能再做 2–3 次'};
  const reps = last.sets.map(s=>s.reps);
  if(last.sets.length >= targetSets(ex,date) && reps.every(r=>r>=ex.hi))
    return {cls:'ok', t:`上次每组都做到 ${ex.hi} 次 → ${ex.assist?'辅助减一档':'加最小一档重量'}`};
  if(reps.some(r=>r<ex.lo)) return {cls:'warn', t:`上次有组不到 ${ex.lo} 次 → 保持，或${ex.assist?'辅助加一档':'降一档'}`};
  return {cls:'mut', t:'保持重量，争取比上次多做 1 次'};
}
const weightStep = ex => /哑铃/.test(ex.n) ? 1 : 2.5;
const WEEK = '日一二三四五六';
function dateLabel(s){
  const d = new Date(s+'T00:00'), t = todayStr();
  const rel = s===t ? '今天' : s===addDays(t,-1) ? '昨天' : s===addDays(t,1) ? '明天' : '';
  return {big: rel || `${d.getMonth()+1}月${d.getDate()}日`, small: `${rel?(d.getMonth()+1)+'月'+d.getDate()+'日 ':''}周${WEEK[d.getDay()]}`};
}

  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo?'<button id="undo">撤销</button>':''}`;
  el.classList.add('show');
  if(undo) $('#undo').onclick = () => { undo(); save(); render(); el.classList.remove('show'); };
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), undo?4000:1500);
}

// ---------- 训练 ----------
function suggestDay(date){
  const today = db.sets.find(s=>s.date===date);
  if(today) return today.day;
  const prev = db.sets.filter(s=>s.date<date).sort((a,b)=>a.date<b.date?-1:1).pop();
  return prev && prev.day==='A' ? 'B' : 'A';
}
const doneBy = n => db.sets.filter(s=>s.date===curDate && s.ex===n);
function viewTrain(){
  const date = curDate;
  day = day || suggestDay(date);
  const exs = PLAN[day].slice();
  const extra = n => { if(!exs.some(e=>e.n===n)) exs.push({n, lo:8, hi:12, extra:true}); };
  db.sets.filter(s=>s.date===date && s.day===day).forEach(s=>extra(s.ex));
  tempEx.forEach(extra);
  curExs = exs;
  const req = exs.filter(e=>!/可选/.test(e.n) && !e.extra);
  const target = req.reduce((a,e)=>a+targetSets(e,date),0);
  const doneReq = req.reduce((a,e)=>a+Math.min(doneBy(e.n).length,targetSets(e,date)),0);
  const ts = db.sets.filter(s=>s.date===date).map(s=>s.ts);
  const mins = ts.length>1 ? Math.round((Math.max(...ts)-Math.min(...ts))/60000) : 0;
  if(openEx===null || (openEx!=='' && !exs.some(e=>e.n===openEx))){
    const next = exs.find(e=>doneBy(e.n).length < targetSets(e,date));
    openEx = next ? next.n : '';
  }
  let h = `<div class="card">
    <div class="seg">${['A','B'].map(d=>`<button class="${d===day?'on':''}" onclick="day='${d}';openEx=null;tempEx=[];render()">训练 ${d}</button>`).join('')}</div>
    <div class="stats">
      <div><b class="num">${doneReq}<small class="mut">/${target}</small></b><span>正式组</span></div>
      <div><b class="num">${mins}<small class="mut"> 分</small></b><span>已练时长</span></div>
      <div><b class="num">${trainWeek(date)}</b><span>第几周</span></div>
    </div>
    <div class="prog"><i style="width:${target?Math.min(100,doneReq/target*100):0}%"></i></div>
  </div>`;
  exs.forEach((ex,i)=>{
    const done = doneBy(ex.n), tgt = ex.extra ? Math.max(done.length,1) : targetSets(ex,date);
    const last = lastSession(ex.n, date);
    const isOpen = ex.n===openEx;
    const st = done.length>=tgt ? 'done' : done.length ? 'part' : '';
    const lastTxt = last ? `上次 ${ex.assist?'辅助':''}${last.sets[0].w}kg × ${last.sets.map(s=>s.reps).join('/')}` : '还没有记录';
    h += `<div class="ex ${isOpen?'open':''}">
      <button class="ex-h" onclick="toggleEx(${i})">
        <div class="dot ${st}">${st==='done'?'✓':done.length||i+1}</div>
        <div class="grow"><div class="t">${esc(ex.n)}</div><div class="s">${ex.extra?'替换动作':`${tgt} 组 × ${ex.lo}–${ex.hi} 次`} · ${lastTxt}</div></div>
        <span class="mut small num">${done.length}/${tgt}</span><span class="chev">${chev('r')}</span>
      </button>`;
    if(isOpen){
      const d = draft[ex.n] || (draft[ex.n] = {
        w: done.length ? done[done.length-1].w : (last ? last.sets[0].w : 0),
        r: done.length ? done[done.length-1].reps : (last ? last.sets[0].reps : ex.lo)});
      const hn = ex.extra ? null : hint(ex,last,date);
      h += `<div class="ex-b">
        ${hn?`<div class="hint ${hn.cls}">${hn.t}</div>`:''}
        ${done.length?`<div class="sets">${done.map((s,k)=>`<button class="set num" onclick="delSet('${s.id}')"><small>${k+1}</small>${s.w}kg × ${s.reps}</button>`).join('')}</div>`:''}
        <div class="pick">
          <div><label>${ex.assist?'辅助重量 kg':'重量 kg'}</label><div class="stepper"><button onclick="adj(${i},'w',-1)" aria-label="减重量">−</button><input class="num" type="number" inputmode="decimal" step="0.5" value="${d.w}" onchange="setDraft(${i},'w',this.value)"><button onclick="adj(${i},'w',1)" aria-label="加重量">+</button></div></div>
          <div><label>次数</label><div class="stepper"><button onclick="adj(${i},'r',-1)" aria-label="减次数">−</button><input class="num" type="number" inputmode="numeric" value="${d.r}" onchange="setDraft(${i},'r',this.value)"><button onclick="adj(${i},'r',1)" aria-label="加次数">+</button></div></div>
        </div>
        <button class="big" onclick="addSet(${i})">记录第 ${done.length+1} 组</button>
        <div class="mut small" style="margin-top:8px;text-align:center">只记完整、标准的次数 · 点已记录的组可删除</div>
      </div>`;
    }
    h += `</div>`;
  });
  h += `<div class="sec">器械被占用？加一个替换动作</div>
    <div class="card"><div class="row"><input class="field" id="oname" placeholder="动作名，如 腿屈伸"><button class="ghost" onclick="addOther()">添加</button></div></div>`;
  return h;
}
function toggleEx(i){ const n = curExs[i].n; openEx = openEx===n ? '' : n; render(); }
function adj(i,k,dir){ const ex=curExs[i], d=draft[ex.n]; d[k] = Math.max(0, +(d[k] + dir*(k==='w'?weightStep(ex):1)).toFixed(2)); render(); }
function setDraft(i,k,v){ const d=draft[curExs[i].n]; const n=parseFloat(v); if(!isNaN(n)&&n>=0) d[k]= k==='r'?Math.round(n):n; render(); }
function addSet(i){
  const ex = curExs[i], d = draft[ex.n];
  if(!d.r) return toast('次数不能为 0');
  if(!db.start || curDate < db.start) db.start = curDate;
  const s = {id:uid(), date:curDate, day, ex:ex.n, w:d.w, reps:d.r, ts:Date.now()};
  db.sets.push(s); save();
  if(!ex.extra && doneBy(ex.n).length >= targetSets(ex,curDate)){
    const next = curExs.find(e=>!e.extra && doneBy(e.n).length < targetSets(e,curDate));
    openEx = next ? next.n : '';
  }
  render();
  startRest(ex.main ? 150 : 90);
  toast(`已记录 ${s.w}kg × ${s.reps}`, ()=>{ db.sets = db.sets.filter(x=>x.id!==s.id); });
}
function addOther(){
  const n = $('#oname').value.trim(); if(!n) return toast('先填动作名');
  if(!tempEx.includes(n)) tempEx.push(n);
  openEx = n; render();
}
function delSet(id){
  const s = db.sets.find(x=>x.id===id); if(!s) return;
  db.sets = db.sets.filter(x=>x.id!==id); save(); render();
  toast(`已删除 ${s.w}kg × ${s.reps}`, ()=>{ db.sets.push(s); });
}

// ---------- 组间休息计时（主动作 2.5 分钟，其余 90 秒）----------
let restEnd = 0, restTotal = 0, restTick = null, audio = null;
function startRest(sec){
  try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); } catch(e){}
  restTotal = sec; restEnd = Date.now() + sec*1000;
  clearInterval(restTick); restTick = setInterval(drawRest, 250); drawRest();
}
function restAdd(s){ restEnd += s*1000; restTotal = Math.max(restTotal + s, 1); drawRest(); }
function stopRest(){ clearInterval(restTick); restEnd = 0; $('#rest').className=''; }
function beep(){
  navigator.vibrate && navigator.vibrate([200,100,200]);
  if(!audio) return;
  [0, .25, .5].forEach(t=>{ const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; g.gain.value=.15;
    o.connect(g); g.connect(audio.destination); o.start(audio.currentTime+t); o.stop(audio.currentTime+t+.15); });
}
function drawRest(){
  const el = $('#rest'), left = Math.round((restEnd - Date.now())/1000);
  if(left <= 0){
    if(!el.classList.contains('done')){ beep(); el.className='show done'; el.innerHTML = `<span class="clock">✓</span><span class="lbl" style="opacity:1">休息结束，开始下一组</span><button onclick="stopRest()">关闭</button>`; }
    if(left < -15) stopRest();
    return;
  }
  const m = Math.floor(left/60), s = String(left%60).padStart(2,'0');
  el.className = 'show';
  el.innerHTML = `<span class="clock num">${m}:${s}</span><span class="lbl">组间休息</span>
    <button onclick="restAdd(-30)">−30</button><button onclick="restAdd(30)">+30</button><button onclick="stopRest()">跳过</button>
    <div class="bar"><i style="width:${Math.max(0,left/restTotal*100)}%"></i></div>`;
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && restEnd) drawRest(); });

  });
  h += `<div class="sec">知道营养标签？直接填</div><div class="card">
    <input class="field" id="fn" placeholder="吃了什么">

    <div class="row" style="margin-top:10px"><select class="field" id="fc" style="width:96px">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select><label class="row grow mut small"><input type="checkbox" id="fsave"> 存成按钮</label><button class="ghost" onclick="addCustom()">记录</button></div>

// 按分量估算：选食物 → 选数量和单位 → 自动算蛋白质和热量

      ${f.u&&f.u['掌心']?'<div class="mut small" style="margin-top:6px">一掌心 ≈ 100 g 熟肉（手掌大小、一指厚，不含手指）</div>':''}
      ${f.u&&f.u['满碗']?'<div class="mut small" style="margin-top:6px">满碗 = 食堂那种口径 13–14 cm 的锥形饭碗装平 ≈ 280 g。碗底小，米饭大多在上半截：冒尖约 1.3 碗；低于碗口一指约 0.7 碗；只到碗壁 2/3 高约 0.5 碗；只到一半高约 0.35 碗</div>':''}
      ${f.u&&f.u['格']?'<div class="mut small" style="margin-top:6px">一格 = 分格盘的一格装满 ≈ 140 g；汤汁多、油亮的菜热量会更高</div>':''}
      ${f.h?'<div class="mut small" style="margin-top:6px">'+f.h+'</div>':''}
    </div>`;
  }
  return h + '</div>';
}
function mealNow(){ const h = new Date().getHours(); return h<10?'早餐':h<14?'午餐':h<18?'加餐':'晚餐'; }
function pickFood(i){ const u = Object.keys(FOODS[i].u||{})[0]; est.i = i; est.unit = u || '两'; est.qty = u ? 1 : 2; render(); }
function estUnit(u){ if(u===est.unit) return; const f = FOODS[est.i], g = foodCalc(f, est.qty, est.unit).grams;
  est.unit = u; const per = foodCalc(f, 1, u).grams; est.qty = u==='g' ? Math.round(g) : Math.round(g/per*2)/2; render(); }
function estAdj(d){ const step = est.unit==='g' ? 10 : 0.5; est.qty = Math.max(0, +(est.qty + d*step).toFixed(1)); render(); }
function addEst(){
  const f = FOODS[est.i], r = foodCalc(f, est.qty, est.unit);
  if(!r.grams) return toast('数量不能为 0');
  const e = {id:uid(), date:curDate, n:`${f.n} ${est.qty}${est.unit}`, p:r.p, k:r.k, ts:Date.now()};
  db.food.push(e); save(); render();
  toast(`已记录 ${e.n}`, ()=>{ db.food = db.food.filter(x=>x.id!==e.id); });
}
function addFood(i){
  const p = db.presets[i], f = {id:uid(), date:curDate, n:p.n, p:p.p, k:p.k, ts:Date.now()};
  db.food.push(f); save(); render();
  const b = $('#pf'+i); b && b.classList.add('flash');
  toast(`已记录 ${p.n}`, ()=>{ db.food = db.food.filter(x=>x.id!==f.id); });
}
function addCustom(){
  const n=$('#fn').value.trim(), p=parseFloat($('#fp').value)||0, kv=parseFloat($('#fk').value), c=$('#fc').value;
  const k = isNaN(kv) ? undefined : kv;
  if(!n) return toast('先填吃了什么');
  if($('#fsave').checked) db.presets.push({n, p, k, c});
  const f = {id:uid(), date:curDate, n, p, k, ts:Date.now()};
  db.food.push(f); save(); render();
  toast(`已记录 ${n}`, ()=>{ db.food = db.food.filter(x=>x.id!==f.id); });
}
function delFood(id){
  const f = db.food.find(x=>x.id===id); if(!f) return;
  db.food = db.food.filter(x=>x.id!==id); save(); render();
  toast(`已删除 ${f.n}`, ()=>{ db.food.push(f); });
}

// ---------- 身体 ----------
function lastBody(k, before){ const d = Object.keys(db.body).filter(x=>x<before && db.body[x][k]!=null).sort().pop(); return d ? db.body[d][k] : null; }
function viewBody(){
  const b = db.body[curDate] || {};
  const hrs = sleepHours(b.bed, b.wake);
  const lw = lastBody('weight', curDate), lwa = lastBody('waist', curDate);
  const scale = (k, from, to) => `<div class="scale">${Array.from({length:to-from+1},(_,j)=>from+j).map(v=>`<button class="${b[k]===v?'on':''}" onclick="setBody('${k}',${b[k]===v?'null':v})">${v}</button>`).join('')}</div>`;
  return `<div class="sec">睡眠</div><div class="card">
    <div class="sleepbig">${hrs!=null?`<b class="num">${fmt1(hrs)}</b><span class="mut">小时</span>${hrs<7?'<span class="pill warn" style="margin-left:auto">少于 7 小时</span>':'<span class="pill ok" style="margin-left:auto">睡够了</span>'}`:'<span class="mut">填上床和起床时间，自动算睡眠时长</span>'}</div>
    <div class="fl"><span>昨晚上床</span><input type="time" value="${b.bed||''}" onchange="setBody('bed',this.value)"></div>
    <div class="fl"><span>今早起床</span><input type="time" value="${b.wake||''}" onchange="setBody('wake',this.value)"></div>
  </div>
  <div class="sec">身体</div><div class="card">
    <div class="fl"><span>晨重 kg<br><small class="mut">${lw!=null?'上次 '+lw:'起床如厕后、吃喝前'}</small></span><input type="number" inputmode="decimal" step="0.1" value="${b.weight??''}" placeholder="—" onchange="setBody('weight',this.value)"></div>
    <div class="fl"><span>腰围 cm<br><small class="mut">${lwa!=null?'上次 '+lwa:'每周一次，肚脐高度'}</small></span><input type="number" inputmode="decimal" step="0.1" value="${b.waist??''}" placeholder="—" onchange="setBody('waist',this.value)"></div>
  </div>
  <div class="sec">状态</div><div class="card">
    <div class="fl"><span>精力</span>${scale('energy',1,5)}</div>
    <div class="fl"><span>腿部酸痛</span>${scale('sore',0,4)}</div>
    <div class="fl"><span>今天吃了油重的饭</span><button class="switch ${b.oily?'on':''}" onclick="setBody('oily',${!b.oily})" aria-label="油重开关"></button></div>
    <div class="fl" style="display:block"><input class="field" value="${esc(b.note||'')}" placeholder="备注：聚餐、爬山、身体不适…" onchange="setBody('note',this.value)"></div>
  </div>
  <p class="mut small" style="text-align:center">改完自动保存 · 精力 1 很差 5 很好 · 酸痛 0 没有 4 影响走路</p>`;
}
function setBody(k, v){
  const b = Object.assign({}, db.body[curDate]);
  if(k==='weight'||k==='waist'){ v = v===''?null:parseFloat(v); if(v!=null && isNaN(v)) v=null; }
  if(v===null || v==='' || v===false) delete b[k]; else b[k]=v;
  if(Object.keys(b).length) db.body[curDate]=b; else delete db.body[curDate];
  save(); render(); toast('已保存');
}

// ---------- 趋势 ----------
function lineChart(title, pts, opt={}){ // pts: [{x:'YYYY-MM-DD', y, y2?}]
  if(pts.length<2) return `<div class="card"><b>${title}</b><div class="empty">记满 2 天后显示曲线</div></div>`;
  const W=600,H=260,L=64,R=12,T=14,B=34;
  const xs=pts.map(p=>new Date(p.x+'T00:00').getTime()), ys=pts.flatMap(p=>[p.y,p.y2]).filter(v=>v!=null);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(opt.y0!=null) y0=Math.min(y0,opt.y0); if(opt.ref!=null){y0=Math.min(y0,opt.ref);y1=Math.max(y1,opt.ref);}
  if(y1===y0){y1+=1;y0-=1;} const pad=(y1-y0)*.12; y0-=pad; y1+=pad;
  const X=t=>L+(t-x0)/(x1-x0||1)*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const path=k=>pts.map((p,i)=>p[k]==null?'':`${X(xs[i]).toFixed(1)},${Y(p[k]).toFixed(1)}`).filter(Boolean).join(' ');
  const main = opt.y2 ? 'y2' : 'y';
  const area = `${X(xs[0])},${H-B} ${path(main)} ${X(xs[xs.length-1])},${H-B}`;
  const ticks=[y0+pad,(y0+y1)/2,y1-pad];
  const gid = 'g'+Math.random().toString(36).slice(2,7);
  return `<div class="card"><b>${title}</b>${opt.sub?`<div class="mut small">${opt.sub}</div>`:''}<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1.5"/><text x="${L-10}" y="${Y(v)+7}" text-anchor="end">${+v.toFixed(1)}</text>`).join('')}
    ${opt.ref!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(opt.ref)}" y2="${Y(opt.ref)}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="8 6"/>`:''}
    <polygon points="${area}" fill="url(#${gid})"/>
    ${opt.y2?`<polyline points="${path('y')}" fill="none" stroke="var(--faint)" stroke-width="2"/>`+pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="4" fill="var(--faint)"/>`).join(''):''}
    <polyline points="${path(main)}" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    ${opt.y2?'':pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="5" fill="var(--card)" stroke="var(--acc)" stroke-width="3"/>`).join('')}
    <text x="${L}" y="${H-6}">${pts[0].x.slice(5)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${pts[pts.length-1].x.slice(5)}</text>
  </svg></div>`;
}
function rolling(pts, days){
  return pts.map(p=>{ const from=addDays(p.x,-(days-1)); const win=pts.filter(q=>q.x>=from&&q.x<=p.x);
    return {...p, y2: win.reduce((a,q)=>a+q.y,0)/win.length}; });
}
function avgIn(pts, from, to){ const w = pts.filter(p=>p.x>=from && p.x<=to); return w.length ? w.reduce((a,p)=>a+p.y,0)/w.length : null; }
function delta(cur, prev, unit, goodDown){
  if(cur==null||prev==null) return '<em class="mut">暂无上周对比</em>';
  const d = cur-prev; if(Math.abs(d)<0.05) return '<em class="mut">与上周持平</em>';
  const good = goodDown ? d<0 : d>0;
  return `<em class="${good?'down':'up'}">${d>0?'↑':'↓'} ${fmt1(Math.abs(d))}${unit} 比上周</em>`;
}
// 1 kg 体重变化约对应 7700 kcal：用两周平均体重之差反推每天的热量缺口
function dailyDeficit(wNow, wPrev){ return wNow==null||wPrev==null ? null : Math.round((wPrev - wNow) * 7700 / 7); }
function deficitCard(wNow, wPrev, kcalPts, from, to){
  const d = dailyDeficit(wNow, wPrev);
  const kDays = kcalPts.filter(p=>p.x>=from && p.x<=to);
  const intake = kDays.length>=5 ? kDays.reduce((a,p)=>a+p.y,0)/kDays.length : null;
  let verdict, cls;
  if(d==null){ verdict='需要连续两周、每周至少 3 天的晨重'; cls='mut'; }
  else if(d < 100){ verdict='基本没有缺口：先查油和汤汁，或增加步行'; cls='up'; }
  else if(d <= 600){ verdict='缺口合适，保持现在的吃法'; cls='down'; }
  else { verdict='缺口偏大：如果饿、累或训练退步，每天多吃 100–200 kcal'; cls='up'; }
  return `<div class="kpi" style="grid-column:span 2"><span>按体重变化推算的每天热量缺口</span>
    <b class="num">${d==null?'—':(d>=0?'约 '+d:'盈余 '+(-d))}<small class="mut"> kcal/天</small></b>
    <em class="${cls}">${verdict}</em>
    ${intake!=null&&d!=null?`<div class="mut small" style="margin-top:4px">近 7 天记录摄入约 ${Math.round(intake)} kcal/天 → 推算维持热量约 ${Math.round(intake + d)} kcal/天</div>`:''}
    <div class="mut small" style="margin-top:4px">体重周平均之差 × 7700 ÷ 7。前两周含水分变化，第 3 周起更准</div></div>`;
}
let chartEx = null;
function viewChart(){
  const t = todayStr(), w1 = addDays(t,-6), w0 = addDays(t,-13), w0e = addDays(t,-7);
  const days = Object.keys(db.body).sort();
  const wPts = days.filter(d=>db.body[d].weight).map(d=>({x:d, y:db.body[d].weight}));
  const waist = days.filter(d=>db.body[d].waist).map(d=>({x:d, y:db.body[d].waist}));
  const sleep = days.map(d=>({x:d, y:sleepHours(db.body[d].bed, db.body[d].wake)})).filter(p=>p.y!=null);
  const pd = {}; db.food.forEach(f=>pd[f.date]=(pd[f.date]||0)+f.p);
  const protein = Object.keys(pd).sort().map(d=>({x:d,y:pd[d]}));
  const kd = {}; db.food.forEach(f=>{ if(f.k!=null) kd[f.date]=(kd[f.date]||0)+f.k; });
  const kcalPts = Object.keys(kd).sort().map(d=>({x:d,y:kd[d]}));
  const wNow = avgIn(wPts,w1,t), wPrev = avgIn(wPts,w0,w0e);
  const sNow = avgIn(sleep,w1,t), sPrev = avgIn(sleep,w0,w0e);
  const pNow = avgIn(protein,w1,t), pHit = protein.filter(p=>p.x>=w1 && p.y>=PROTEIN_TARGET).length;
  const trainDays = new Set(db.sets.filter(s=>s.date>=w1 && s.date<=t).map(s=>s.date)).size;
  const lastWaist = waist.length ? waist[waist.length-1] : null;
  const wd = waist.length>1 ? lastWaist.y - waist[0].y : null;
  let h = `<div class="kpis">
    <div class="kpi"><span>近 7 天平均体重</span><b class="num">${wNow!=null?fmt1(wNow):'—'}<small class="mut"> kg</small></b>${delta(wNow,wPrev,' kg',true)}</div>
    <div class="kpi"><span>最新腰围</span><b class="num">${lastWaist?lastWaist.y:'—'}<small class="mut"> cm</small></b>${wd!=null?`<em class="${wd<=0?'down':'up'}">比起始 ${wd<=0?'↓':'↑'} ${fmt1(Math.abs(wd))} cm</em>`:'<em class="mut">每周量一次</em>'}</div>
    <div class="kpi"><span>近 7 天平均睡眠</span><b class="num">${sNow!=null?fmt1(sNow):'—'}<small class="mut"> 小时</small></b>${delta(sNow,sPrev,' h',false)}</div>
    <div class="kpi"><span>近 7 天蛋白质</span><b class="num">${pNow!=null?Math.round(pNow):'—'}<small class="mut"> g/天</small></b><em class="mut">${pHit} 天达到 ${PROTEIN_TARGET} g</em></div>
    ${deficitCard(wNow, wPrev, kcalPts, w1, t)}
    <div class="kpi" style="grid-column:span 2"><span>近 7 天训练</span><b class="num">${trainDays}<small class="mut"> 次</small></b><em class="${trainDays>=3?'down':'mut'}">${trainDays>=3?'达到每周 3 次':'目标每周 3 次'}</em></div>
  </div>`;
  const exNames = [...new Set(db.sets.map(s=>s.ex))];
  chartEx = exNames.includes(chartEx) ? chartEx : exNames[0];
  h += lineChart('晨重', rolling(wPts,7), {y2:true, sub:'灰点为每天，蓝线为 7 天平均'})
    + lineChart('腰围 cm', waist)
    + lineChart('睡眠时长', sleep, {ref:7, sub:'绿色虚线为 7 小时'})
    + lineChart('每日蛋白质 g', protein, {ref:PROTEIN_TARGET, y0:0, sub:`绿色虚线为 ${PROTEIN_TARGET} g`})
    + lineChart('每日热量 kcal（估）', kcalPts, {ref:KCAL_TARGET, y0:0, sub:`绿色虚线为参考 ${KCAL_TARGET}；外食误差大，只看大致趋势`});
  if(exNames.length){
    const exPts = {}; db.sets.filter(s=>s.ex===chartEx).forEach(s=>{ const e = s.w*(1+s.reps/30); exPts[s.date]=Math.max(exPts[s.date]||0, e); });
    const isAssist = [...PLAN.A,...PLAN.B].some(e=>e.n===chartEx && e.assist);
    h += `<div class="sec">动作进步</div><div class="card" style="padding:10px"><select class="chartsel" onchange="chartEx=this.value;render()">${exNames.map(n=>`<option ${n===chartEx?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`
      + lineChart(esc(chartEx), Object.keys(exPts).sort().map(d=>({x:d, y:+exPts[d].toFixed(1)})),
          {sub: isAssist ? '辅助动作：数值下降才是进步' : '按 重量×(1+次数/30) 估算的力量，看趋势用'});
  }
  return h;
}

// ---------- 数据 ----------
function csv(rows){ return '﻿' + rows.map(r=>r.map(v=>{ v=v??''; v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n'); }
function download(name, text, type){
  const blob = new Blob([text], {type});
  const file = new File([blob], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})) return navigator.share({files:[file]}).catch(()=>{});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function exportCSV(which){
  const t = todayStr();
  if(which==='sets'){
    const cnt={}; download(`训练_${t}.csv`, csv([['日期','训练日','动作','第几组','重量kg','次数'],
      ...db.sets.slice().sort((a,b)=>a.ts-b.ts).map(s=>{ const k=s.date+s.ex; cnt[k]=(cnt[k]||0)+1; return [s.date,s.day,s.ex,cnt[k],s.w,s.reps]; })]), 'text/csv');
  } else if(which==='food'){
    download(`饮食_${t}.csv`, csv([['日期','时间','内容','蛋白质g','热量kcal'], ...db.food.slice().sort((a,b)=>a.ts-b.ts).map(f=>[f.date,new Date(f.ts).toTimeString().slice(0,5),f.n,f.p,f.k])]), 'text/csv');
  } else {
    download(`身体_${t}.csv`, csv([['日期','上床','起床','睡眠小时','晨重kg','腰围cm','精力','酸痛','油重','备注'],
      ...Object.keys(db.body).sort().map(d=>{ const b=db.body[d], h=sleepHours(b.bed,b.wake); return [d,b.bed,b.wake,h==null?'':h.toFixed(2),b.weight,b.waist,b.energy,b.sore,b.oily?'是':'',b.note]; })]), 'text/csv');
  }
}
function backup(){ download(`练吃睡备份_${todayStr()}.json`, JSON.stringify(db), 'application/json'); db.lastBackup=todayStr(); save(); render(); }
function restore(input){
  const f = input.files[0]; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t); if(!Array.isArray(d.sets)||!Array.isArray(d.food)) throw new Error('不是本应用的备份文件');
    if(confirm(`备份里有 ${d.sets.length} 组训练、${d.food.length} 条饮食。用它覆盖当前数据？`)){ db=Object.assign({presets:DEFAULT_PRESETS,body:{}},d); save(); render(); toast('已恢复'); } })
   .catch(e=>alert('读取失败：'+e.message));
}
function delPreset(i){
  const p = db.presets[i]; db.presets.splice(i,1); save(); render();
  toast(`已删除按钮 ${p.n}`, ()=>{ db.presets.splice(i,0,p); });
}
function viewData(){
  const since = db.lastBackup ? Math.round((new Date(todayStr())-new Date(db.lastBackup))/864e5) : null;
  const stale = since==null || since>7;
  return `<div class="card"><div class="row"><div class="grow"><b>备份</b><div class="mut small">数据只存在这台手机里，每周备份一次到「文件」或发给自己</div></div>
      <span class="pill ${stale?'warn':'ok'}">${since==null?'从未备份':since===0?'今天已备份':since+' 天前'}</span></div>
    <div class="row" style="margin-top:12px"><button class="big" style="flex:1" onclick="backup()">立即备份</button>
      <label class="ghost">恢复<input type="file" accept=".json,application/json" onchange="restore(this)" hidden></label></div></div>
  <div class="sec">导出表格（发给 Claude 分析）</div>
  <div class="card"><div class="grid" style="grid-template-columns:repeat(3,1fr)">
    <button class="ghost" onclick="exportCSV('sets')">训练</button><button class="ghost" onclick="exportCSV('food')">饮食</button><button class="ghost" onclick="exportCSV('body')">身体睡眠</button></div></div>
  <div class="sec">饮食按钮</div>
  <div class="card"><div class="log" style="margin-top:0;border-top:0">${db.presets.map((p,i)=>`<div><span class="pill">${p.c}</span><span class="grow">${esc(p.n)}</span><span class="mut num">${p.p} g</span><button class="x" onclick="delPreset(${i})" aria-label="删除">×</button></div>`).join('')}</div>
    <div class="mut small" style="margin-top:8px">在「饮食」页自己填时勾选「同时存成按钮」即可添加</div></div>
  <p class="mut small" style="text-align:center">${db.sets.length} 组训练 · ${db.food.length} 条饮食 · ${Object.keys(db.body).length} 天身体记录</p>`;
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
render();
</script>
